# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 locked offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify lockfile
        run: uv lock --check

      - name: Synchronize locked environment
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --locked ruff check .
        env:
          UV_OFFLINE: "true"

      - name: Ruff format check
        run: uv run --locked ruff format --check .
        env:
          UV_OFFLINE: "true"

      - name: MyPy strict
        run: uv run --locked mypy src
        env:
          UV_OFFLINE: "true"

      - name: pytest with application-level network guard
        run: uv run --locked pytest -v
        env:
          UV_OFFLINE: "true"

      - name: Reject tracked record and sequence artifacts
        run: |
          forbidden=$(git ls-files | grep -E '\.(parquet|fasta|fa|tsv\.gz|pt|pth|ckpt)$|^(data/(raw|processed|interim)/|results/runs/|cache/)' | grep -v '^cache/\.gitkeep$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked generated artifact policy violation:"
            echo "$forbidden"
            exit 1
          fi

      - name: Build package artifacts
        run: uv build
        env:
          UV_OFFLINE: "true"

      - name: Smoke-test wheel in an isolated environment
        run: |
          WHEEL=$(find "$PWD/dist" -name 'protein_split_audit-*.whl' -print -quit)
          test -n "$WHEEL"
          uv run --isolated --no-project --with "$WHEEL" psaudit --version
          uv run --isolated --no-project --with "$WHEEL" psaudit doctor
          uv run --isolated --no-project --with "$WHEEL" psaudit cohort --help
          uv run --isolated --no-project --with "$WHEEL" psaudit similarity --help
          uv run --isolated --no-project --with "$WHEEL" psaudit split --help
          uv run --isolated --no-project --with "$WHEEL" psaudit feature --help
          uv run --isolated --no-project --with "$WHEEL" psaudit model --help
          uv run --isolated --no-project --with "$WHEEL" psaudit evaluate --help
          uv run --isolated --no-project --with "$WHEEL" psaudit experiment --help

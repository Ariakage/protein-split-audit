# SPDX-License-Identifier: Apache-2.0

schema_version: 1
operation: audit
name: random
strategy: random_control
run_mode: freeze
violation_identity_threshold: null
runtime: {executable: mmseqs, cache_root: ../../cache/mmseqs, timeout_seconds: 3600, threads: 8}
search: &search
  sensitivity: 7.5
  evalue: 0.001
  search_type: 1
  sequence_identity_mode: 0
  min_sequence_identity: 0.0
  minimum_coverage: 0.80
  coverage_mode: 0
  alignment_mode: 3
  format_mode: 4
input:
  split_manifest: ../../data/manifests/splits/random.parquet
  split_content_manifest: ../../data/manifests/splits/random.json
  cohort_manifest: ../../data/manifests/cohorts/pilot-v1.parquet
  cohort_content_manifest: ../../data/manifests/cohorts/pilot-v1.json
  cohort_fasta: ../../data/processed/cohorts/pilot-v1.fasta
output:
  train_fasta: ../../data/processed/audits/random-train.fasta
  test_fasta: ../../data/processed/audits/random-test.fasta
  audit_manifest: ../../data/manifests/audits/random.parquet
  content_manifest: ../../data/manifests/audits/random.json
  summary: ../../results/runs/audit-random/summary.json
  run_dir: ../../results/runs/audit-random
  overwrite: false

schema_version: 1
operation: cohort_cluster_base
name: cluster30
run_mode: freeze
runtime: &runtime
  executable: mmseqs
  cache_root: ../../cache/mmseqs
  timeout_seconds: 3600
  threads: 8
cluster: &cluster
  sensitivity: 7.5
  evalue: 0.001
  sequence_identity_mode: 0
  min_sequence_identity: 0.30
  minimum_coverage: 0.80
  coverage_mode: 0
  alignment_mode: 3
  cluster_mode: 0
  cluster_reassign: true
self_search:
  sensitivity: 7.5
  evalue: 0.001
  search_type: 1
  sequence_identity_mode: 0
  min_sequence_identity: 0.30
  minimum_coverage: 0.80
  coverage_mode: 0
  alignment_mode: 3
  format_mode: 4
input:
  cohort_manifest: ../../data/manifests/cohorts/pilot-v1.parquet
  cohort_content_manifest: ../../data/manifests/cohorts/pilot-v1.json
  fasta: ../../data/processed/cohorts/pilot-v1.fasta
output:
  cluster_manifest: ../../data/manifests/similarity/pilot-v1-cluster30.parquet
  content_manifest: ../../data/manifests/similarity/pilot-v1-cluster30.json
  pair_table: ../../data/processed/similarity/pilot-v1-pairs30.parquet
  run_dir: ../../results/runs/similarity-pilot-v1-cluster30
  overwrite: false
